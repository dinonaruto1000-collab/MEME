# .github/workflows/ci.yml
# Flujo de Integración Continua (CI) para el proyecto Tasty‑Burger
# -----------------------------------------------------------
# Cada paso incluye comentarios explicativos en español.

name: CI

on:
  push:
    branches: [ main ]        # Ejecutar al hacer push a la rama principal
  pull_request:
    branches: [ main ]        # Ejecutar en PRs dirigidos a la rama principal

jobs:
  build:
    runs-on: windows-latest   # Usar runner Windows (coincide con el entorno de desarrollo)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Obtiene el código del repositorio para trabajar con él.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # Usa Node 20 (compatible con Vite y paquetes actuales)
          cache: 'npm'          # Cachea los módulos npm para acelerar ejecuciones.

      - name: Install dependencies
        run: npm ci
        # `npm ci` instala exactamente las versiones del package‑lock; proceso limpio y reproducible.

      - name: Lint the codebase
        run: npm run lint --silent
        # Ejecuta ESLint según la configuración de .eslintrc.cjs. Fallará el job si hay errores de lint.

      - name: Run tests (placeholder)
        run: echo "Agrega aquí el comando de pruebas, por ejemplo npm test"
        # Sustituye el echo por el comando real de pruebas cuando lo tengas.

      - name: Build production bundle
        run: npm run build
        # Compila la aplicación en modo producción para asegurar que el build no tenga errores.
